name: Daily market update

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Update market database
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python -m scripts.update_market
      - name: Build aligned features and adjustment audit
        run: python -m scripts.build_features
      - name: Print data quality
        run: python -m scripts.report_data_quality
      - name: Print feature status
        run: python -m scripts.report_feature_status
      - name: Train baseline model
        run: python -m scripts.train_baseline
      - name: Print model status
        run: python -m scripts.report_model_status
      - name: Train calibrated ensemble
        run: python -m scripts.train_ensemble
      - name: Print ensemble status
        run: python -m scripts.report_ensemble_status
      - name: Run walk-forward backtest
        run: python -m scripts.run_backtest
      - name: Print backtest status
        run: python -m scripts.report_backtest_status
      - name: Print experiment registry
        run: python -m scripts.report_experiments
      - name: Commit database updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.db data/experiments/
          git diff --cached --quiet || git commit -m "data: daily features, ensemble, and backtest update"
          git push
