name: Daily market update
on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update, train and score
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: run: python -m scripts.update_and_train
      - name: Commit generated database and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.db models/ensemble.joblib
          git diff --cached --quiet || git commit -m "chore: daily market update"
          git push
