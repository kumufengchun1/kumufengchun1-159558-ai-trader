[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-data-platform"
version = "0.6.0"
description = "Reliable daily market data and feature platform for the 159558 AI Trading System"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "yfinance>=0.2.54,<1",
  "PyYAML>=6.0,<7",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["ats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

